<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>lifelog — 환경 점검</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #fff;
        --text: #14181d;
        --muted: #6a7480;
        --line: #e2e6ea;
        --ok: #1c7a4a;
        --bad: #c8372d;
        --warn: #8a6100;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111315;
          --surface: #1a1e22;
          --text: #e8ecef;
          --muted: #98a2ad;
          --line: #2a3037;
          --ok: #5fd08a;
          --bad: #ff7a6e;
          --warn: #e8b84b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 16px) 16px 40px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          system-ui, sans-serif;
      }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .lede { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .card h2 { font-size: 15px; margin: 0 0 2px; }
      .why { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
      button {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 14px;
        min-height: 42px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      .out {
        margin-top: 10px;
        font-size: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      .env {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
        white-space: pre-wrap;
        margin: 0;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      code {
        font-size: 12px;
        background: var(--bg);
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/check/check.ts"></script>
  </body>
</html>
